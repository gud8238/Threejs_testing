<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="lib/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #stage { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="720">
      <canvas id="stage" width="1280" height="720"></canvas>
    </div>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__timelines = window.__timelines || {};
      window.__hf.buildReady.scene = new Promise((res, rej) => { window.__sceneDone = res; window.__sceneFail = rej; });
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
